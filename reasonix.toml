p: target = 1200 - 48 = 1152\n// clamp: max(0, min(1152, 1400)) = 1152\n// result: 1152 (光标上方留 48px 边距, 在视口内)\nconsole.log('--- 场景1: 用户滚到底,表格在中部 ---');\nconst scrollTop = 1400;\nconst rectTop = -200, rectBottom = -170;\nconst top1 = rectTop - 0 + scrollTop;\nconst bot1 = rectBottom - 0 + scrollTop;\nconsole.log('top=', top1, 'bottom=', bot1, 'viewport=', scrollTop, scrollTop + clientHeight);\nlet target1;\nif (bot1 > (scrollTop + clientHeight) - margin) {\n  target1 = bot1 - clientHeight + margin;\n} else {\n  target1 = top1 - margin;\n}\ntarget1 = Math.max(0, Math.min(target1, maxScroll));\nconsole.log('target=', target1);\n\n// 场景2: 用户没滚动,空文档插入表格,光标在表格内\n// rect.top = 100, rootRect.top = 0, scrollTop = 0\n// top = 100, bottom = 130\n// viewportTop=0, viewportBottom=600\n// bottom(130) < viewportBottom-margin(552) → 不走 down\n// top(100) >= viewportTop+margin(48) → 已可见,不动\nconsole.log('--- 场景2: 小文档,光标已在视口 ---');\nconst top2 = 100, bot2 = 130;\nif (bot2 <= 600 - margin && top2 >= 0 + margin) {\n  console.log('stay');\n} else {\n  console.log('would scroll');\n}\n\n// 场景3: 文档很长,光标在文档底部 (用户已滚到底,但光标被状态栏遮住)\n// rect.top = 540, rootRect.top = 0, scrollTop = 1400\n// top = 540 - 0 + 1400 = 1940\n// bottom = 570 + 1400 = 1970\n// viewportTop=1400, viewportBottom=2000\n// bottom(1970) > viewportBottom-margin(1952) → 走 down: target = 1970 - 600 + 48 = 1418\n// clamp: min(1418, 1400) = 1400\nconsole.log('--- 场景3: 光标在底部,紧贴状态栏 ---');\nconst top3 = 540, bot3 = 570;\nlet target3;\nif (bot3 > 2000 - margin) {\n  target3 = bot3 - clientHeight + margin;\n  console.log('down branch, raw target=', target3);\n} else {\n  target3 = top3 - margin;\n}\ntarget3 = Math.max(0, Math.min(target3, maxScroll));\nconsole.log('target=', target3);\n\"", "Bash=cd /c/Users/manwa/Desktop/LiteMD && node -e \"\nconst fs = require('fs');\nlet s = fs.readFileSync('src/editor.ts', 'utf8');\n// 替换所有空的 view.dispatch({}) 为带滚动的 dispatch,anchor 变量已在上文定义\ns = s.replace(/view\\.dispatch\\(\\{\\s*\\n\\s*\\}\\);/g, 