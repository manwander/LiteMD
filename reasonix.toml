 /c/Users/manwa/Desktop/LiteMD && node -e \"\nconst fs = require('fs');\nlet s = fs.readFileSync('src/editor.ts', 'utf8');\n// 删除整行:  +  view.dispatch({ effects: EditorView.scrollIntoView(...) });\nconst patterns = [\n  /^  view\\.dispatch\\(\\{\\s*effects:\\s*EditorView\\.scrollIntoView\\([^)]*\\)\\s*\\}\\);\\s*\\n/gm,\n  /^    effects:\\s*EditorView\\.scrollIntoView\\([^)]*\\),\\s*\\n/gm,\n];\nlet total = 0;\nfor (const re of patterns) {\n  const m = s.match(re);\n  if (m) total += m.length;\n  s = s.replace(re, '');\n}\nfs.writeFileSync('src/editor.ts', s);\nconsole.log('removed lines:', total);\n\"\ngrep -n \"EditorView.scrollIntoView\\|effects: EditorView\" src/editor.ts", "Bash=node -e \"\n// 模拟用户场景:\n// - root.scrollHeight = 2000 (整个文档高)\n// - root.clientHeight = 600 (视口高)\n// - 用户已滚到底部: root.scrollTop = 1400\n// - 表格在文档中部, 光标在表格第一格: rect.top = 0 (屏幕), rootRect.top = 0\n//   实际像素(已滚到底): 表格的 rect.top = 0, rootRect.top = 0, 所以\n//   top = 0 - 0 + 1400 = 1400\n//   bottom = 30 - 0 + 1400 = 1430\n//   viewportTop = 1400, viewportBottom = 2000\n// 光标在 viewport 范围内(1400~1430 在 1400~2000 内),应不动\nconst rootScrollTop = 1400;\nconst rectTop = 0;\nconst rectBottom = 30;\nconst rootRectTop = 0;\nconst clientHeight = 600;\nconst scrollHeight = 2000;\nconst margin = 60;\n\nconst top = rectTop - rootRectTop + rootScrollTop;\nconst bottom = rectBottom - rootRectTop + rootScrollTop;\nconst viewportTop = rootScrollTop;\nconst viewportBottom = viewportTop + clientHeight;\nconsole.log('top=', top, 'bottom=', bottom, 'viewport=', viewportTop, viewportBottom);\n\nlet target = rootScrollTop;\nif (bottom > viewportBottom - margin) {\n  target = bottom - clientHeight + margin;\n  console.log('branch: down');\n} else if (top < viewportTop) {\n  target = top - margin;\n  console.log('branch: up');\n} else {\n  console.log('branch: stay (visible)');\n}\nconst max = Math.max(0, scrollHeight - clientHeight);\ntarget = Math.max(0, Math.min(target, max));\nconsole.log('target=', target, 'current=', rootScrollTop, 'changed=', target !== rootScrollTop);\n\n// 反例: 用户滚到底部后, 表格在文档顶部附近\n// 即表格 rect.top = -1300 (在视口外顶部)\n// 加上 rootScrollTop = 1400 -> top = 100, bottom = 130\n// viewportTop = 1400, viewportBottom = 2000\n// bottom(130) < viewportBottom(2000) - margin(60) = 1940 → 不走 down 分支\n// top(100) < viewportTop(1400) → 走 up 分支: target = 100 - 60 = 40\n// root.scrollTop 从 1400 → 40 → 看起来「跳到顶部」!\nconsole.log('---反例---');\nconst rootScrollTop2 = 1400;\nconst rectTop2 = -1300, rectBottom2 = -1270;\nconst top2 = rectTop2 - 0 + rootScrollTop2;\nconst bottom2 = rectBottom2 - 0 + rootScrollTop2;\nconsole.log('top2=', top2, 'bottom2=', bottom2, 'viewport=', rootScrollTop2, rootScrollTop2 + clientHeight);\nlet target2 = rootScrollTop2;\nif (bottom2 > (rootScrollTop2 + clientHeight) - margin) {\n  target2 = bottom2 - clientHeight + margin;\n} else if (top2 < rootScrollTop2) {\n  target2 = top2 - margin;\n  console.log('UP: target =', target2);\n}\n// 正确的目标应该是 40 (让光标在视口顶下方 60px)\n// 但目前用户报告是「跳到文档前面(顶部)」—— 旧公式 target = bottom - clientHeight + margin = -1270 - 600 + 60 = -1810 -> Math.max(0, ...) = 0\nconsole.log('OLD formula target =', Math.max(0, bottom2 - clientHeight + margin));\n\"", "Bash=cd /c/Users/manwa/Desktop/LiteMD && python3 -c \"\nimport re\nwith open('src/preview-edit-keys.ts', 'rb') as f:\n    data = f.read()\nold = b'export function scrollCaretIntoView(root: HTMLElement): void {\\n  const sel = window.getSelection();\\n  if (!sel || !sel.rangeCount) return;\\n  const r = sel.getRangeAt(0);\\n  // \\xe5\\x8f\\x96\\xe5\\x85\\x89\\xe6\\xa0\\x87\\xe5\\xaf\\xb9\\xe5\\xba\\x94\\xe7\\x9a\\x84\\xe5\\xae\\xa2\\xe6\\x88\\xb7\\xe7\\xab\\xaf\\xe7\\x9f\\xa9\\xe5\\xbd\\xa2'\nprint('old starts at:', data.find(old))\nprint('CRLF in old:', b'\\r\\n' in old)\n\"", "Bash=cd /c/Users/manwa/Desktop/LiteMD && python -c \"\nimport re\nwith open('src/preview-edit-keys.ts', 'rb') as f:\n    data = f.read()\n# 找 scrollCaretIntoView 函数体\nneedle = b'export function scrollCaret