[package]
name = "litemd"
version = "0.1.0"
description = "LiteMD - 超轻量 Markdown 编辑器"
authors = ["LiteMD"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "litemd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
# 图片压缩：仅启用 JPEG/PNG 编解码，控制二进制体积
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
